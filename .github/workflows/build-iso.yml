name: Build ApinOS ISO

on:
  push:
    branches: [main]
    paths:
      - "config/**"
      - "scripts/**"
      - "apps/**"
      - ".github/workflows/build-iso.yml"
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish the built ISO as a GitHub Release"
        required: true
        type: boolean
        default: true
      release_tag:
        description: "Release tag (for example v1.0.0)"
        required: true
        type: string
        default: "v1.0.0"

permissions:
  contents: read

concurrency:
  group: apinos-iso-build
  cancel-in-progress: false

jobs:
  build:
    name: Build ApinOS Debian 13 XFCE ISO
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 360
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build ApinOS ISO with Debian live-build
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl
          docker pull debian:trixie
          mkdir -p "$RUNNER_TEMP/apinos-apt-cache"
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$RUNNER_TEMP/apinos-apt-cache:/var/cache/apt/archives" \
            -w /work \
            debian:trixie bash -lc '
              set -euo pipefail
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                live-build debootstrap debian-archive-keyring xorriso squashfs-tools \
                isolinux syslinux-common ca-certificates curl git gnupg
              bash ./scripts/build-iso.sh
            '

      - name: Upload ApinOS ISO
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apinos-iso-${{ github.run_number }}
          path: build/apinos-amd64.iso
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" build/apinos-amd64.iso \
            --repo "$GITHUB_REPOSITORY" \
            --title "ApinOS ${RELEASE_TAG#v}" \
            --notes "ApinOS ${RELEASE_TAG#v} initial release. Based on Debian 13 Trixie (amd64) with XFCE desktop."

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apinos-build-log-${{ github.run_number }}
          path: build/live-build.log
          if-no-files-found: ignore
          retention-days: 30
