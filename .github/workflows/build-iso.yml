name: Build ApinOS ISO

on:
  push:
    branches: [main]
    paths:
      - "config/**"
      - "scripts/**"
      - "apps/**"
      - ".github/workflows/build-iso.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apinos-iso-build
  cancel-in-progress: false

jobs:
  build:
    name: Build Debian 13 XFCE ISO
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    container:
      image: debian:trixie
    timeout-minutes: 360
    steps:
      - name: Install checkout prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install live-build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            live-build debootstrap debian-archive-keyring xorriso squashfs-tools

      - name: Build ApinOS ISO
        shell: bash
        run: bash ./scripts/build-iso.sh

      - name: Verify ISO output
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t images < <(find build -maxdepth 1 -type f -name '*.iso' -print)
          if [[ "${#images[@]}" -ne 1 ]]; then
            echo "Expected exactly one ISO, found ${#images[@]}" >&2
            exit 1
          fi
          image="${images[0]}"
          test -s "$image"
          sha256sum "$image" | tee build/SHA256SUMS

      - name: Upload ISO build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apinos-iso-${{ github.run_number }}
          path: |
            build/apinos-amd64.iso
            build/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publish ISO prerelease
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download ISO build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: apinos-iso-${{ github.run_number }}
          path: dist

      - name: Publish ISO to GitHub prerelease
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: apinos-build-${{ github.run_number }}
          name: ApinOS ISO Build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: |
            dist/apinos-amd64.iso
            dist/SHA256SUMS
